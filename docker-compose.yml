# Local stack. `make db-up` starts only Postgres; `make up` builds everything.
# This runs production builds on one machine for testing; it is not a production
# deployment (no TLS, no backups, one replica, secrets from .env).
name: go-next-boilerplate

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-app}
      POSTGRES_PASSWORD: ${PGPASSWORD:-app}
      POSTGRES_DB: ${PGDATABASE:-app}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Identity provider. The realm (roles, clients, dev users) is imported from
  # deploy/keycloak/realm-app.json on first start. Everyone, browsers and
  # containers alike, sees the issuer as http://localhost:8180; containers reach
  # it at http://keycloak:8080 (backchannel), which the API is told about.
  # Dev mode, in-memory storage: production needs `start` with a real database.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./deploy/keycloak/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
    healthcheck:
      # The image has no curl; ask the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  # Workflow engine. Temporal's dev server: one process, history in memory, web
  # UI at http://localhost:8233. Production uses Temporal Cloud or a real cluster.
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # Applies migrations once, then exits; the api starts only if it succeeds.
  migrate:
    build: .
    command: ["migrate"]
    environment: &db-env
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:-app}
      PGPASSWORD: ${PGPASSWORD:-app}
      PGDATABASE: ${PGDATABASE:-app}
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    profiles: [full]

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *db-env
      APP_ENV: production
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/app
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/app
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${PORT:-8080}:8080"
    # Probe every second while starting, then every 10s; the image's own
    # HEALTHCHECK would wait 30s before the first probe.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/livez"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [full]

  # Runs the workflows the API starts. Same image as the API, other command.
  worker:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    entrypoint: ["worker"]
    restart: unless-stopped
    environment:
      <<: *db-env
      APP_ENV: production
      TEMPORAL_ADDRESS: temporal:7233
    # No HTTP port, so no healthcheck: the image's probe would always fail.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    profiles: [full]

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      APP_URL: http://localhost:${WEB_PORT:-3000}
      AUTH_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/app
      AUTH_INTERNAL_ISSUER: http://keycloak:8080/realms/app
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-dev-web-secret}
      # Dev value for the local production-like stack; set your own anywhere real.
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-0123456789abcdef0123}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: that resolves to ::1 here, and Next listens on IPv4 only
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy
    profiles: [full]

volumes:
  db_data:
