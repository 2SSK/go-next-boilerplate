# Monitoring for development: `make mon-up` starts it, Grafana at
# http://localhost:3001. Included by docker-compose.yml, so it shares the
# app's network; every service is in the `monitoring` profile and stays off
# until asked for.
#
#   app processes ──OTLP──▶ otel-collector ──▶ Tempo (traces), Loki (logs)
#   Prometheus ──scrapes──▶ /metrics on the API (9464), worker (9465), Temporal
#   Grafana reads all three; the Temporal UI reads Temporal.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on: [tempo, loki]
    profiles: [monitoring]

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    profiles: [monitoring]

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./deploy/monitoring/loki.yaml:/etc/loki.yaml:ro
      - loki_data:/loki
    profiles: [monitoring]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Reaches the API and worker when they run on the host (`make dev`).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 1s
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      # Local only (bound to 127.0.0.1): no login. Never expose this setup.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
    depends_on: [prometheus, tempo, loki]
    profiles: [monitoring]

  temporal-ui:
    image: temporalio/ui:2.56.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8080"
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    profiles: [monitoring]

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
