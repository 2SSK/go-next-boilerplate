# Each app process serves /metrics on its own internal port. Every job lists
# two targets: the process on the host (`make dev`) and in Docker (`make up`).
# Only one runs at a time, so the other shows as down; that is expected.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels: { run: host }
      - targets: ["api:9464"]
        labels: { run: docker }

  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:9465"]
        labels: { run: host }
      - targets: ["worker:9465"]
        labels: { run: docker }

  # The Temporal dev server's own metrics (task queues, persistence, ...).
  - job_name: temporal
    static_configs:
      - targets: ["temporal:7235"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
